name: Store Release & Verification Pipeline (Google Play & Apple TestFlight)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # =========================================================================
  # JOB 1: Verificación de Motores Criptográficos en Rust y Circuitos Noir
  # =========================================================================
  verify-rust-and-noir:
    name: 🛡️ Verify Rust Core (11/11 Tests) & Noir Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-engine

      - name: Run Cryptographic & Transport Tests (11/11 in <1ms)
        run: |
          echo "Ejecutando suite criptográfica completa NIST FIPS 203/204 + SPQR + Aztec Siloed Nullifiers..."
          cargo test --manifest-path core-engine/Cargo.toml --release -- --nocapture

      - name: Validate Aztec Noir Smart Contract Structure
        run: |
          echo "Verificando estructura y sintaxis de contratos Noir (PairwiseSessionRegistry)..."
          test -f contracts/Nargo.toml || (echo "Falta Nargo.toml" && exit 1)
          test -f contracts/src/main.nr || (echo "Falta contracts/src/main.nr" && exit 1)
          test -f contracts/src/session_note.nr || (echo "Falta contracts/src/session_note.nr" && exit 1)
          echo "✓ Contratos Noir validados para Aztec L2 Testnet."

  # =========================================================================
  # JOB 2: Compilación de Android App Bundle (.aab) para Google Play
  # =========================================================================
  build-android-aab:
    name: 🤖 Build Android App Bundle (.aab)
    needs: verify-rust-and-noir
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Setup Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk & uniffi-bindgen
        run: |
          cargo install cargo-ndk --locked
          cargo install uniffi_bindgen

      - name: Compile Native libchaquant_core.so via cargo-ndk
        run: |
          echo "Compilando librerías compartidas .so para arm64-v8a, armeabi-v7a y x86_64..."
          mkdir -p mobile/android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o mobile/android/app/src/main/jniLibs \
            build --release --manifest-path core-engine/Cargo.toml

      - name: Generate Kotlin UniFFI Bindings
        run: |
          echo "Generando bindings Kotlin a partir de chaquant.udl..."
          mkdir -p mobile/android/app/src/main/java/uniffi/chaquant_core
          uniffi-bindgen generate core-engine/chaquant.udl \
            --language kotlin \
            --out-dir mobile/android/app/src/main/java/uniffi/chaquant_core

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Android App Bundle (.aab)
        working-directory: mobile/android
        env:
          CHAQUANT_UPLOAD_STORE_PASSWORD: ${{ secrets.CHAQUANT_UPLOAD_STORE_PASSWORD }}
          CHAQUANT_UPLOAD_KEY_ALIAS: ${{ secrets.CHAQUANT_UPLOAD_KEY_ALIAS }}
          CHAQUANT_UPLOAD_KEY_PASSWORD: ${{ secrets.CHAQUANT_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew bundleRelease --stacktrace

      - name: Upload Android Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaquant-protocol-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # =========================================================================
  # JOB 3: Compilación de iOS ChaquantCore.xcframework para Apple TestFlight
  # =========================================================================
  build-ios-xcframework:
    name: 🍏 Build iOS ChaquantCore.xcframework (Apple TestFlight)
    needs: verify-rust-and-noir
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Rust Toolchain & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Install uniffi-bindgen
        run: cargo install uniffi_bindgen

      - name: Compile Native Rust for iOS Devices and Simulators
        run: |
          echo "Compilando librería estática para dispositivo físico iOS (arm64)..."
          cargo build --release --manifest-path core-engine/Cargo.toml --target aarch64-apple-ios

          echo "Compilando librería estática para simulador iOS (arm64-sim)..."
          cargo build --release --manifest-path core-engine/Cargo.toml --target aarch64-apple-ios-sim

      - name: Generate Swift UniFFI Bindings & C-Header
        run: |
          mkdir -p mobile/ios/GeneratedBindings
          uniffi-bindgen generate core-engine/chaquant.udl \
            --language swift \
            --out-dir mobile/ios/GeneratedBindings

      - name: Package Universal ChaquantCore.xcframework
        run: |
          mkdir -p mobile/ios/Frameworks
          xcodebuild -create-xcframework \
            -library core-engine/target/aarch64-apple-ios/release/libchaquant_core.a \
            -headers mobile/ios/GeneratedBindings \
            -library core-engine/target/aarch64-apple-ios-sim/release/libchaquant_core.a \
            -headers mobile/ios/GeneratedBindings \
            -output mobile/ios/Frameworks/ChaquantCore.xcframework

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChaquantCore-iOS-xcframework
          path: mobile/ios/Frameworks/ChaquantCore.xcframework
          if-no-files-found: warn
